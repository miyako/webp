name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # fast lane: format, clippy, tests on the dev platform
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup toolchain install 1.100.0 --component clippy,rustfmt
      - name: Format
        run: cargo +1.100.0 fmt --check
      - name: Clippy
        run: cargo +1.100.0 clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo +1.100.0 test --workspace
      - name: Release build
        run: cargo +1.100.0 build --release

  build-native:
    # The portability claim (ADR-015) rests on shipping fully static
    # libwebp; verify per-platform release builds actually link.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15 # arm64; cross-builds x86_64 and lipos the Universal
          - os: windows-2022
            triple: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        shell: bash
        run: |
          rustup toolchain install 1.100.0
          if [ "${{ runner.os }}" = "macOS" ]; then
            rustup target add x86_64-apple-darwin
          else
            rustup target add ${{ matrix.triple }}
          fi
      - name: Build native + Universal (macOS, ADR-015)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cargo +1.100.0 build --release
          mv target/release/webp-convert target/release/webp-convert-arm64
          cargo +1.100.0 build --release --target x86_64-apple-darwin
          lipo -create -output target/release/webp-convert \
            target/release/webp-convert-arm64 \
            target/x86_64-apple-darwin/release/webp-convert
          lipo -info target/release/webp-convert
          otool -L target/release/webp-convert
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: cargo +1.100.0 build --release --target x86_64-pc-windows-msvc
      - name: Smoke test (linked formats + a real conversion)
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            BIN=target/x86_64-pc-windows-msvc/release/webp-convert.exe
          else
            BIN=target/release/webp-convert
          fi
          "$BIN" formats
          "$BIN" capabilities --json
      - name: Conversion tests (run the real decoder/encoder suite natively)
        shell: bash
        run: cargo +1.100.0 test -p webp-convert --test matrix --test streams
          --test advanced --test metadata --release

  4d-acceptance:
    # Hosted 4D component acceptance; gated on a repository variable the
    # owner sets (vars.FOURD_ENABLED == 'true'). On forks or when unset the
    # job is skipped. See .github/workflows/4d.yml.
    needs: checks
    if: vars.FOURD_ENABLED == 'true'
    uses: ./.github/workflows/4d.yml
    with:
      source_sha: ${{ github.sha }}
    secrets: inherit
